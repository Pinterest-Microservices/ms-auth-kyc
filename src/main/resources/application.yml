logging:
  level:
    org.springframework: DEBUG

server:
  port: 0
  forward-headers-strategy: framework

spring:
  application:
    name: ms-auth-kyc
  config:
    import: "classpath:application-vault.yml,vault://"
  security:
    oauth2:
      client:
        registration:
          pin-client:
            client-id: ${client-id}
            client-secret: ${client-secret}
            authorization-grant-type: ${grant-type}
            redirect-uri: ${redirect-uri}
            scope:
              - openid
              - profile
              - email
              - offline_access
            provider: keycloak
        provider:
          keycloak:
            issuer-uri: ${issuer-uri}

management:
  endpoints:
    web:
      exposure:
        include: health,info

eureka:
  instance:
    prefer-ip-address: true
    ip-address: 127.0.0.1
  client:
    service-url:
      defaultZone: ${eureka-server}

lib-exception:
  error-reporting:
    dsn: ${bug-sink-dsn}
    environment: ${spring.profiles.active:local}

lib-auth-kyc:
  keycloak:
